      <h1 style="margin: 0 0 20px; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: clamp(34px, 4.4vw, 52px); line-height: 1.12; letter-spacing: -1.5px">Celestial Casino: a game in 24 hours</h1>
      <p style="margin: 0 0 14px; color: #3D372F">Celestial Casino is a 3D blackjack game inspired by Star Wars, built by a team of two at devHacks 2026, a 24-hour hackathon. Players sit down at a blackjack table in a space-themed casino.</p>
      <p style="margin: 0; color: #3D372F">My partner and I were both interested in game design but had no prior game development experience to start from. We spent the first part of the event working through concepts, then turned our idea into a playable game before time ran out. I created the 3D blackjack table in Blender, a tool I learned during the hackathon itself.</p>
    </section>

      <div style="border-radius: 24px; border: 2px solid #2B2E45; background: #0A0B1E; box-shadow: 6px 6px 0 rgba(43,46,69,.12); overflow: hidden; line-height: 0">

        <img src="577154e626.jpg" alt="Render of the 3D blackjack table: a half-moon wooden table with seven cup holders around a green felt playing surface" style="display: block; width: 100%; height: auto; border-radius: 24px; border: 2px solid #2B2E45; box-shadow: 6px 6px 0 rgba(43,46,69,.12)">

        <h2 id="table-h" style="margin: 0 0 16px; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 30px; letter-spacing: -1px">the blackjack table</h2>
        <p style="margin: 0 0 14px; color: #3D372F">With no prior Blender experience, I taught myself the software during the hackathon and modelled the blackjack table independently, without following a tutorial. The model is built from a few clean components: a semicircular wooden base, a raised rail with seven recessed cup holders, and an inset playing surface.</p>
        <p style="margin: 0; color: #3D372F">For the materials, I applied a wood texture set with colour, normal and roughness maps, so the grain and sheen respond realistically to the game's lighting, and gave the playing surface a deep green felt finish. I then exported the model as an FBX file into our Unity project, where it became the centrepiece of the game.</p>
      </div>
