  <header style="max-width: 1120px; margin: 0 auto; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
    <a href="index.html" style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 20px; text-decoration: none; letter-spacing: -0.5px">charlotte erkau</a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500">

    </nav>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 56px 32px 96px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center">
    <div style="flex: 999 1 520px; min-width: 0">
      <figure style="float: right; margin: 0 0 16px 32px; width: 220px; background: #FFFFFF; padding: 10px 10px 12px; border: 1px solid #DDD6C6; box-shadow: 4px 6px 0 rgba(31,29,26,.10); transform: rotate(3deg); position: relative">
        <span aria-hidden="true" style="position: absolute; top: -9px; left: 50%; margin-left: -28px; width: 56px; height: 18px; background: rgba(242,201,76,.65); transform: rotate(-4deg)"></span>
        <img src="69401615c2.jpg" alt="Charlotte smiling in front of Van Gogh's Sunflowers in a gallery" style="display: block; width: 100%; height: auto">
        <figcaption style="margin-top: 8px; text-align: center; font-family: 'Cedarville Cursive', cursive; font-size: 24px; color: #6B6B6B">with Van Gogh's Sunflowers</figcaption>
      </figure>
      <p style="display: inline-block; margin: 0 0 18px; padding: 5px 14px; border-radius: 999px; border: 2px solid #1F1D1A; background: #CFDEFC; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #1F1D1A">contact</p>
      <h1 data-star style="position: relative; margin: 0 0 20px; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: clamp(40px, 5.4vw, 64px); line-height: 1.08; letter-spacing: -2px">Let's make something.</h1>
      <p style="margin: 0 0 32px; max-width: 540px; color: #3D372F">I'm looking for internships and new grad roles in engineering, software, design and beyond, I'm happy to relocate, and I'm always up for creative or art collaborations. The fastest way to reach me is email.</p>

      <div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 40px">
        <a href="mailto:charlotteerkau@gmail.com" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 28px; border-radius: 999px; background: #1F1D1A; color: #FCF6E3; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 17px">charlotteerkau@gmail.com</a>
        <button onClick="{{copy}}" style="cursor: pointer; min-height: 56px; padding: 0 22px; border-radius: 999px; border: 2px solid #1F1D1A; background: transparent; color: #1F1D1A; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px">{{copyLabel}}</button>
      </div>

      <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px">
        <li><a href="https://linkedin.com/in/charlotte-erkau" style="display: flex; flex-direction: column; gap: 4px; padding: 20px 22px; background: #CFDEFC; border: 2px solid #2F3B2E; border-radius: 20px; text-decoration: none; box-shadow: 5px 5px 0 rgba(47,59,46,.14)"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px">LinkedIn ↗</span><span style="font-size: 14px; color: #3D372F">charlotte-erkau</span></a></li>
        <li><a href="https://github.com/charlotte-erk" style="display: flex; flex-direction: column; gap: 4px; padding: 20px 22px; background: #DCE8D2; border: 2px solid #2F3B2E; border-radius: 20px; text-decoration: none; box-shadow: 5px 5px 0 rgba(47,59,46,.14)"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px">GitHub ↗</span><span style="font-size: 14px; color: #3D372F">charlotte-erk</span></a></li>
        <li><a href="Charlotte_Erkau_Resume.pdf" style="display: flex; flex-direction: column; gap: 4px; padding: 20px 22px; background: #EAB9CA; border: 2px solid #2F3B2E; border-radius: 20px; text-decoration: none; box-shadow: 5px 5px 0 rgba(47,59,46,.14)"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 18px">Resume ↓</span><span style="font-size: 14px; color: #3A1F2A">PDF</span></a></li>
      </ul>

      <p style="margin: 32px 0 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #5C5346">based in Winnipeg, MB · open to relocating · graduating June 2027</p>
    </div>

    <div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <span style="font-family: 'Cedarville Cursive', cursive; font-size: 27px; color: #6B6B6B; transform: rotate(-4deg)">while you're here, say hi to my tamagotchi ↓</span>
      <div style="width: 300px; height: 340px; border-radius: 50% 50% 46% 46% / 56% 56% 44% 44%; background: #EAB9CA; border: 3px solid #1F1D1A; box-shadow: 8px 8px 0 rgba(47,59,46,.16), inset -14px -18px 0 rgba(156,53,96,.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px">
        <div role="status" aria-live="polite" style="width: 170px; height: 140px; border-radius: 16px; background: #C9D6B8; border: 3px solid #1F1D1A; box-shadow: inset 0 0 0 6px #B6C4A3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-family: 'JetBrains Mono', monospace; color: #1F2A18">
          <span aria-hidden="true" style="font-size: 12px; letter-spacing: 2px">{{hearts}}</span>
          <span style="font-size: 30px; font-weight: 700; line-height: 1; transform: translateY({{bob}}); transition: transform .25s">{{face}}</span>
          <span style="font-size: 11px; font-weight: 700; text-align: center; padding: 0 8px">{{msg}}</span>
        </div>
        <div style="display: flex; gap: 10px">
          <sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
            <button onClick="{{a.go}}" style="cursor: pointer; width: 64px; height: 44px; border-radius: 999px; border: 2.5px solid #1F1D1A; background: #FFFDF7; color: #1F1D1A; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 800; box-shadow: 0 3px 0 #1F1D1A">{{a.label}}</button>
          </sc-for>
        </div>
      </div>
      <p style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #5C5346">times cared for: {{count}}</p>
    </div>
  </main>

  <footer style="border-top: 2px solid #2F3B2E">
    <div style="max-width: 1120px; margin: 0 auto; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 14px">
      <span>© 2026 Charlotte Erkau</span>
      <span style="display: flex; gap: 20px"><a href="https://linkedin.com/in/charlotte-erkau">LinkedIn</a><a href="https://github.com/charlotte-erk">GitHub</a></span>
    </div>
  </footer>

</template>
<noscript><p style="font-family: sans-serif; padding: 24px">This site needs JavaScript turned on to show everything.</p></noscript>
<script src="dc.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { copied: false, mood: 'idle', love: 2, count: 0, bob: false };
  }
  componentWillUnmount() {
    clearTimeout(this.moodTimer);
    clearInterval(this.bobTimer);
  }
  componentDidMount() {
    this.bobTimer = setInterval(() => this.setState({ bob: !this.state.bob }), 900);
  }
  care(mood) {
    clearTimeout(this.moodTimer);
    this.setState({ mood, love: Math.min(4, this.state.love + 1), count: this.state.count + 1 });
    this.moodTimer = setTimeout(() => this.setState({ mood: this.state.love >= 4 ? 'happy' : 'idle' }), 2200);
  }
  renderVals() {
    const moods = {
      idle: { face: '(o_o)', msg: 'hi! press a button' },
      happy: { face: '(^_^)', msg: 'so loved. email charlotte!' },
      feed: { face: '(^~^)', msg: 'nom nom… a cookie!' },
      play: { face: '\\(^o^)/', msg: 'wheee!' },
      pet: { face: '(>w<)', msg: 'purr…' }
    };
    const m = moods[this.state.mood];
    const love = this.state.love;
    return {
      face: m.face,
      msg: m.msg,
      hearts: '♥'.repeat(love) + '♡'.repeat(4 - love),
      bob: this.state.bob ? '-3px' : '0px',
      count: this.state.count,
      actions: [
        { label: 'feed', go: () => this.care('feed') },
        { label: 'play', go: () => this.care('play') },
        { label: 'pet', go: () => this.care('pet') }
      ],
      copyLabel: this.state.copied ? 'copied ✓' : 'copy email',
      copy: () => {
        try {
          if (navigator.clipboard) navigator.clipboard.writeText('charlotteerkau@gmail.com').catch(() => {});
        } catch (e) {}
        this.setState({ copied: true });
        setTimeout(() => this.setState({ copied: false }), 2000);
      }
    };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
