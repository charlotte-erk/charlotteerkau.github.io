<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects | Charlotte Erkau</title>
<meta name="description" content="Projects by Charlotte Erkau across software, design and hardware.">
<link rel="icon" href="bdf4886434.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;cursor:url(a1a898a6dc.svg) 3 2, auto}
a{color:#1F1D1A}a:hover{opacity:.75}
button:focus-visible,a:focus-visible{outline:3px solid #3B4FA0;outline-offset:3px}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; background: #FCF6E3; color: #1F1D1A; font-family: 'DM Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.6">

  <header style="max-width: 1120px; margin: 0 auto; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
    <a href="index.html" style="font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 20px; text-decoration: none; letter-spacing: -0.5px">charlotte erkau</a>
    <nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 500">
      <a href="about.html" style="padding: 10px 14px; text-decoration: none">about</a>
      <a href="projects.html" aria-current="page" style="padding: 10px 14px; text-decoration: underline; text-underline-offset: 6px; text-decoration-thickness: 2px">projects</a>
      <a href="sketchbook.html" style="padding: 10px 14px; text-decoration: none">sketchbook</a>
      <a href="contact.html" style="padding: 10px 14px; text-decoration: none">contact</a>
      <a href="Charlotte_Erkau_Resume.pdf" style="padding: 10px 16px; text-decoration: none; border: 2px solid #1F1D1A; border-radius: 999px; margin-left: 6px">resume ↗</a>
    </nav>
  </header>

  <main style="max-width: 1120px; margin: 0 auto; padding: 0 32px 96px">
    <section style="padding: 56px 0 40px; max-width: 720px">
      <p style="display: inline-block; margin: 0 0 18px; padding: 5px 14px; border-radius: 999px; border: 2px solid #1F1D1A; background: #CFDEFC; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; color: #1F1D1A">projects</p>
      <h1 data-star style="position: relative; margin: 0 0 20px; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: clamp(36px, 4.6vw, 54px); line-height: 1.12; letter-spacing: -1.5px">Things I've designed and built.</h1>
      <p style="margin: 0; color: #3D372F">Class projects, hackathons and personal experiments, from Figma mockups to Unity games to a robot.</p>
    </section>

    <div role="group" aria-label="Filter projects" style="display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 36px">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
        <button onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="cursor: pointer; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 2px solid #1F1D1A; background: {{f.bg}}; color: {{f.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700">{{f.label}} <span style="opacity: .7">({{f.count}})</span></button>
      </sc-for>
    </div>

    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 28px">
      <sc-for list="{{shown}}" as="p" hint-placeholder-count="6">
        <article style="grid-column: {{p.span}}; background: #FFFDF7; border: 2px solid #2F3B2E; border-radius: 24px; overflow: hidden; box-shadow: 6px 6px 0 rgba(47,59,46,.14); display: flex; flex-wrap: wrap">
          <sc-if value="{{p.showImgArea}}" hint-placeholder-val="{{ true }}">
          <div style="flex: 1 1 {{p.imgBasis}}; min-height: {{p.imgH}}; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; padding: 24px; border-bottom: 2px solid #2F3B2E; box-sizing: border-box">
            <sc-if value="{{p.imgSrc}}" hint-placeholder-val="{{ false }}">
              <img src="{{p.imgSrc}}" alt="{{p.imgAlt}}" style="display: block; max-width: 100%; max-height: {{p.imgMax}}; height: auto; border-radius: 12px; border: 2px solid #2F3B2E">
            </sc-if>
          </div>
          </sc-if>
          <div style="flex: 1 1 360px; padding: 26px 28px 30px; display: flex; flex-direction: column; gap: 10px">
            <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #5C5346">{{p.context}}</span>
              <sc-if value="{{p.status}}" hint-placeholder-val="{{ false }}">
                <span style="padding: 2px 10px; border-radius: 999px; background: #CFDEFC; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700">{{p.status}}</span>
              </sc-if>
            </div>
            <h2 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 24px; letter-spacing: -0.5px; line-height: 1.2">{{p.title}}</h2>
            <sc-if value="{{p.sponsor}}" hint-placeholder-val="{{ false }}">
              <p style="margin: 2px 0 0; align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: #2B2E45; color: #FCF6E3; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #D4A231; display: inline-block"></span>{{p.sponsor}}</p>
            </sc-if>
            <sc-if value="{{p.role}}" hint-placeholder-val="{{ true }}">
              <p style="margin: 0; font-size: 14px; font-weight: 700; color: #9C3560">My role: {{p.role}}</p>
            </sc-if>
            <p style="margin: 0; color: #3D372F">{{p.desc}}</p>
            <ul style="list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px">
              <sc-for list="{{p.tags}}" as="tag" hint-placeholder-count="3">
                <li style="padding: 4px 12px; border-radius: 999px; background: #F6EDD6; color: #3D372F; border: 1.5px solid #D8C9A3; font-family: 'JetBrains Mono', monospace; font-size: 13px">{{tag}}</li>
              </sc-for>
            </ul>
            <div style="display: flex; flex-wrap: wrap; gap: 18px; margin-top: auto; padding-top: 12px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700">
              <sc-if value="{{p.caseHref}}" hint-placeholder-val="{{ false }}">
                <a href="{{p.caseHref}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #1F1D1A; color: #FCF6E3; text-decoration: none">read case study →</a>
              </sc-if>
              <sc-if value="{{p.github}}" hint-placeholder-val="{{ true }}">
                <a href="#" style="display: inline-flex; align-items: center; min-height: 44px">GitHub ↗</a>
              </sc-if>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </main>

  <footer style="border-top: 2px solid #2F3B2E">
    <div style="max-width: 1120px; margin: 0 auto; padding: 28px 32px; display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 14px">
      <span>© 2026 Charlotte Erkau</span>
      <span style="display: flex; gap: 20px"><a href="https://linkedin.com/in/charlotte-erkau">LinkedIn</a><a href="https://github.com/charlotte-erk">GitHub</a><a href="contact.html">Email</a></span>
    </div>
  </footer>
</div>
</template>
<noscript><p style="font-family: sans-serif; padding: 24px">This site needs JavaScript turned on to show everything.</p></noscript>
<script src="dc.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    const projects = [
      { title: 'Cycle Wise: UI redesign', context: 'Software Engineering 1 · team of 5', role: 'UI design & front end',
        desc: 'An Android period tracking app developed in collaboration with a team of five women. I led the UI redesign, from the colour system and moon logo to every screen, and established the team\u2019s Git branching strategy. The case study shows the before and after side by side.',
        tags: ['UI/UX', 'Visual design', 'Android', 'Java', 'GitLab'], cats: ['design', 'software'], featured: true,
        img: '', imgSrc: '1206cbce2d.png',
        imgAlt: 'Cycle Wise Log screen before and after: default purple form on the left, redesigned pink card layout with logo on the right', tint: '#F8E6EE', caseHref: 'cycle-wise.html', github: true },
      { title: 'Garbage-collecting robot', context: 'Engineering capstone · team of 5', status: 'in progress', role: 'mechanical co-lead & UI lead',
        sponsor: 'Industry-sponsored by Volatus Aerospace',
        desc: 'A "Wall-E"-like garbage-collecting robot, developed by a team of five for our engineering capstone in partnership with our industry sponsor, Volatus Aerospace. I am a mechanical co-lead and in charge of the robot\u2019s user interface. I also delivered our initial design review presentation to a large panel of technical experts and students.',
        tags: ['Fusion 360', 'Mechanical design', 'UI design', 'Robotics'], cats: ['design', 'hardware'],
        img: '[photo of the robot or CAD render]', tint: '#CFDEFC', github: false },
      { title: 'Celestial Casino', context: 'devHacks 2026 · 24-hour hackathon · team of 2', role: '3D modelling & game logic support',
        desc: 'A 3D blackjack game inspired by Star Wars, built with a partner during the hackathon. I learned Blender during the event to model and texture the blackjack table, and helped with the game logic while my partner led the programming in Unity.',
        tags: ['Unity', 'C#', 'Blender'], cats: ['software', 'design'],
        img: '', imgSrc: '577154e626.jpg', imgAlt: 'Render of the 3D blackjack table: a half-moon wooden table with seven cup holders around a green felt playing surface', tint: '#0B1020', caseHref: 'celestial-casino.html', github: true },
      { title: 'NHL teams database', context: 'Database Concepts and Usage · team of 5', status: 'in progress',
        desc: 'A database of NHL team data, designed and queried with SQL.',
        tags: ['SQL', 'Database design'], cats: ['software'],
        noPicture: true, tint: '#FDE3A2', github: false },
      { title: 'Pill tracking system', context: 'Human-Computer Interaction 2 · team project', status: 'in progress', role: 'original concept, user research & prototyping',
        desc: 'A medication tracking system designed primarily for people with ADHD and older adults, to help them take the right medication at the right time. I proposed the original concept and was one of a few students selected to pitch their idea to the class. As part of the team, I contribute to the user interviews and the digital prototype.',
        tags: ['User interviews', 'Prototyping', 'Interaction design', 'Pitching'], cats: ['design'],
        noPicture: true, tint: '#EAB9CA', github: false },
      { title: 'SweepSync: communication device for deaf curlers', context: 'Digital Systems Design 1 · team of 5', role: 'UX/UI, 3D modelling, testing & presenting',
        desc: 'A broom-mounted device that turns the skip\u2019s commands into light patterns, so deaf and hard-of-hearing curlers can follow the play. I focused on the user experience: an ergonomic controller layout, and colours and patterns that stay distinguishable for colour-blind players. I also contributed to the 3D-modelled enclosure, tested the device, designed the presentation and presented it.',
        tags: ['UX/UI', 'Accessibility', '3D modelling', 'Presenting'], cats: ['hardware', 'design'],
        img: '', imgSrc: '80bd409e14.png',
        imgAlt: 'SweepSync slide for the Hard command: a row of blue LEDs, the controller with its top button highlighted, and a curling stone travelling to the target', tint: '#DCE8D2', caseHref: 'sweepsync.html', github: false },
      { title: 'U of M Bisons Social Hub', context: 'Human-Computer Interaction', role: 'front end & navigation design',
        desc: 'A web prototype with an interactive calendar and event pages, applying HCI principles to the navigation flow. I illustrated all of the bison characters that guide users through the site, each of which switches to a different animation on hover.',
        tags: ['HTML/CSS', 'JavaScript', 'HCI', 'Illustration'], cats: ['design', 'software'],
        img: '[calendar page screenshot]', imgSrc: '2efdd31b12.jpg',
        imgAlt: 'UM Bisons Hub home page: an illustrated University of Manitoba building with four bison characters linking to the calendar, clubs, social events and keyword search', tint: '#CFDEFC', github: true },
      { title: 'Bloom Focus', context: 'Personal project', role: 'design & development',
        desc: 'A focus timer that grows a flower through five stages as a session progresses and plays a gentle twinkle when time is up. I hand-drew every pixel art asset, designed the interface in Figma, and built it with JavaScript, HTML and CSS.',
        tags: ['JavaScript', 'HTML/CSS', 'Figma', 'Pixel art'], cats: ['design', 'software'],
        img: '[the flower animation]', imgSrc: 'b82409ac3a.png',
        imgAlt: 'Bloom Focus Timer: a hand-drawn pixel art flower in a green frame, a countdown with pause, play and stop buttons, and preset times from 1 to 60 minutes', tint: '#ECE5EE', github: true }
    ];
    const f = this.state.filter;
    const defs = [['all', 'all'], ['design', 'design'], ['software', 'software'], ['hardware', 'hardware']];
    const filters = defs.map(([id, label]) => ({
      label,
      count: id === 'all' ? projects.length : projects.filter(p => p.cats.includes(id)).length,
      pressed: f === id ? 'true' : 'false',
      bg: f === id ? '#1F1D1A' : 'transparent',
      fg: f === id ? '#FCF6E3' : '#1F1D1A',
      pick: () => this.setState({ filter: id })
    }));
    const shown = projects
      .filter(p => f === 'all' || p.cats.includes(f))
      .map(p => ({
        ...p,
        status: p.status || false,
        role: p.role || false,
        sponsor: p.sponsor || false,
        caseHref: p.caseHref || false,
        imgSrc: p.imgSrc || false,
        imgAlt: p.imgAlt || '',
        noImg: !p.imgSrc,
        showImgArea: true,
        span: p.featured ? '1 / -1' : 'auto',
        imgBasis: p.featured ? '600px' : '100%',
        imgH: p.featured ? '560px' : '220px',
        imgMax: p.featured ? '560px' : '300px'
      }));
    return { filters, shown };
  }
}
DC.mount(Component, {});
</script>
</body>
</html>
